[package]
name = "supermark"
version = "0.4.2"
description = "SuperMark — Markdown editor for Windows (Tauri v2 + WebView2 + CodeMirror 6 CoreEditor)"
authors = ["SuperMark Contributors"]
license = "MIT"
edition = "2021"

[lib]
name = "supermark_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# The single-file Windows build (SuperMark_<version>_x64_portable.exe, see release.yml): it cannot
# install updates itself, so Check for Updates sends people to the download page instead.
portable = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["custom-protocol", "protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-segmentation = "1.11"
dirs = "5"
rfd = "0.15"
encoding_rs = "0.8"
chardetng = "0.1"
notify = "6"
zip = { version = "2", default-features = false, features = ["deflate"] }
arboard = "3"
ureq = { version = "2", default-features = false, features = ["tls"] }
sha2 = { version = "0.10" }
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"

[dev-dependencies]
tempfile = "3"

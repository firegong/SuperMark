[package]
name = "markedit-win"
version = "0.1.0"
description = "MarkEdit for Windows (Tauri v2 + WebView2 + CodeMirror 6 CoreEditor)"
authors = ["MarkEdit-Win Contributors"]
license = "MIT"
edition = "2021"

[lib]
name = "markedit_win_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-segmentation = "1.11"
dirs = "5"
rfd = "0.15"
encoding_rs = "0.8"
chardetng = "0.1"
notify = "6"

[dev-dependencies]
tempfile = "3"

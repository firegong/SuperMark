<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SuperMark</title>
  <link href="./index.css" type="text/css" rel="stylesheet">
  <link href="./src/chrome/index.css" type="text/css" rel="stylesheet">
<link href="./src/chrome/sidebar.css" type="text/css" rel="stylesheet">
  <link href="./src/modules/preview/index.css" type="text/css" rel="stylesheet">
  <link href="./src/@quicklook/index.css" type="text/css" rel="stylesheet">
  <script>
    // Merge, do not overwrite: the desktop host injects window.config and MarkEdit.userSettings
    // with an initialization script that runs before this one.
    (function () {
      var hostConfig = "{{EDITOR_CONFIG}}";
      var hostSettings = "{{USER_SETTINGS}}";
      var injected = typeof window.config === 'object' && window.config !== null ? window.config : {};
      window.config = Object.assign({}, typeof hostConfig === 'object' ? hostConfig : {}, injected);
      var existing = typeof window.MarkEdit === 'object' && window.MarkEdit !== null ? window.MarkEdit : {};
      window.MarkEdit = Object.assign({}, existing, {
        editorConfig: window.config,
        userSettings: existing.userSettings || (typeof hostSettings === 'object' ? hostSettings : {}),
      });
    })();
  </script>
</head>
<body>
  <div id="editor"></div>
  <script type=module src="./index.ts"></script>
</body>
</html>
